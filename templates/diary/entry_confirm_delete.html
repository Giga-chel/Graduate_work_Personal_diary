{% extends 'base.html' %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger display-5"></i>
                <h1 class="h4 mt-3">Удалить запись «{{ object.title }}»?</h1>
                <p class="text-muted">Действие необратимо.</p>
                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                    <a href="{% url 'diary:entry_detail' object.pk %}"
                       class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
